name: Publish Docker UI image

on:
  push:
    branches:
      - codex/upstream-main-20260918
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish Next.js UI image
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            drmspidi/hevy2garmin:latest
            drmspidi/hevy2garmin:0.12.0-ui
            drmspidi/hevy2garmin:ui-latest
          labels: |
            org.opencontainers.image.source=https://github.com/drkostas/hevy2garmin
            org.opencontainers.image.revision=4a18c02
            org.opencontainers.image.title=hevy2garmin-web
